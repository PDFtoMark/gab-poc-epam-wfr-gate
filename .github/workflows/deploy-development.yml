name: Deploy development

on:
  workflow_run:
    workflows: ["Release Workflow"]
    types: [completed]

permissions:
  contents: read

jobs:
  gate:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Privileged deploy step (stands in for reusable deploy workflow)
        env:
          DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          echo "PRIVILEGED_STEP_RAN=true"
          echo "trigger_event=${{ github.event.workflow_run.event }}"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "secret_present=$([ -n "$DEPLOY_TRIGGER_TOKEN" ] && echo yes || echo no)"
